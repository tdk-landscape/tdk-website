title: TDK CLI
email: vntu0412179+tdk-waitlist@gmail.com
lang: en_US
description: >-
  Kubernetes-free microservice development. Run 5-30+ services locally
  without learning Kubernetes. One service.json generates 12-17 files per service.
author:
  name: TDK Team

baseurl: "/tdk-website"
url: "https://tdk-landscape.github.io"

twitter_username: tdkcli
github_username: tdk-cli
social_image: "/assets/images/tdk-social-card.png"
logo: "/assets/images/tdk-social-card.png"

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  docs:
    output: true
    permalink: /:collection/:path/
  features:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/tdk-social-card.png"
      sitemap: true
  - scope:
      path: "blog/articles"
    values:
      date: "2026-09-11"
      last_modified_at: "2026-09-11"
      sitemap: true
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"
  - scope:
      path: "assets/images"
    values:
      sitemap: false

sass:
  style: compressed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - test/
  - README.md
  - docker-compose.yml
  - Dockerfile
